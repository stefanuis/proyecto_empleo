<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block page_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
</head>

<body>

    <!-- Overlay para móvil -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    {% include 'admin_maestro/header.html' %}

    <div class="contenedor">
        {% include 'admin_maestro/menu.html' %}
        <main class="contenido">
            {% include "_alertas.html" %}
            {% block contenido %}
            {% endblock %}
        </main>
    </div>

    {% include 'admin_maestro/footer.html' %}

</body>
<script src="{{ url_for('static', filename='js/alertas.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/sidebar.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/sesion.js') }}" defer
        data-minutos="{{ sesion_inactiva_minutos }}"
        data-mantener="{{ url_for('web.mantener_sesion') }}"
        data-salir="{{ url_for('web.cerrar', motivo='inactividad') }}"></script>

<script>

    // Función para toggle del menú
    function toggleMenu(element) {
        const toggleSection = element.closest('.sidebar-toggle-section');
        const content = toggleSection.querySelector('.toggle-content');
        const arrow = toggleSection.querySelector('.toggle-arrow');
        const header = toggleSection.querySelector('.toggle-header');

        content.classList.toggle('open');
        arrow.classList.toggle('open');
        header.classList.toggle('active');
    }

    // Cerrar otros menús al abrir uno
    document.querySelectorAll('.toggle-header').forEach(header => {
        header.addEventListener('click', function(e) {
            const currentSection = this.closest('.sidebar-toggle-section');
            const currentContent = currentSection.querySelector('.toggle-content');

            if (currentContent.classList.contains('open')) {
                return;
            }

            document.querySelectorAll('.toggle-content.open').forEach(content => {
                if (content !== currentContent) {
                    content.classList.remove('open');
                    const section = content.closest('.sidebar-toggle-section');
                    const arrow = section.querySelector('.toggle-arrow');
                    const header = section.querySelector('.toggle-header');
                    if (arrow) arrow.classList.remove('open');
                    if (header) header.classList.remove('active');
                }
            });
        });
    });

    // Cerrar menús al hacer clic fuera de la sidebar
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.sidebar') && !e.target.closest('#sidebarToggleBtn')) {
            document.querySelectorAll('.toggle-content.open').forEach(content => {
                content.classList.remove('open');
                const section = content.closest('.sidebar-toggle-section');
                const arrow = section.querySelector('.toggle-arrow');
                const header = section.querySelector('.toggle-header');
                if (arrow) arrow.classList.remove('open');
                if (header) header.classList.remove('active');
            });
        }
    });
    document.querySelectorAll('.toggle-content a').forEach(link => {
        link.addEventListener('click', function() {
            const content = this.closest('.toggle-content');
            const section = content.closest('.sidebar-toggle-section');
            const arrow = section.querySelector('.toggle-arrow');
            const header = section.querySelector('.toggle-header');

            content.classList.remove('open');
            if (arrow) arrow.classList.remove('open');
            if (header) header.classList.remove('active');
        });
    });
</script>

</html>
