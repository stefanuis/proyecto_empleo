{% extends 'admin/base.html' %}
{% block contenido %}

<div class="main-area">
  
   <main class="page-content">

    <p class="dashboard-fecha">{{ fecha_hoy }}</p>
    <h1 class="dashboard-saludo">Hola, {{ current_user.nombres or 'admin' }}</h1>

        <!-- Pendientes: lo que hay que atender hoy -->
        <h2 class="pendientes-titulo">Pendientes</h2>
        <div class="pendientes-grid">
            {% for pendiente in pendientes %}
                <a href="{{ pendiente.url }}"
                   class="pendiente-card {{ 'pendiente-activo' if pendiente.cantidad else 'pendiente-ok' }}">
                    <span class="pendiente-cantidad">{{ pendiente.cantidad }}</span>
                    <span class="pendiente-texto">
                        <strong>{{ pendiente.titulo }}</strong>
                        <small>{{ pendiente.detalle }}</small>
                    </span>
                </a>
            {% endfor %}
        </div>

        <div class="card-config">
            <div class="bar-wrap-grande">
                {{ grafico_html | safe }}
            </div>
        </div>

    </main>
</div>



{% endblock %}
