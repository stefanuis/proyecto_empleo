<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block page_css %}{% endblock %}
    {# Ajustes para celular del portal del candidato (el admin no la carga) #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/movil_usuario.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
</head>

<body>

    <!-- Overlay para móvil (nuevo) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    {% include 'usuario/header.html' %}

    <div class="contenedor">
        {% include 'usuario/menu.html' %}
        <main class="contenido">
            {% include "_alertas.html" %}
            {% block contenido %}
            {% endblock %}
        </main>
    </div>

    {% include 'usuario/footer.html' %}
    <script src="{{ url_for('static', filename='js/limite_filas.js') }}"></script>
    <script src="{{ url_for('static', filename='js/alertas.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/sesion.js') }}" defer
            data-minutos="{{ sesion_inactiva_minutos }}"
            data-mantener="{{ url_for('web.mantener_sesion') }}"
            data-salir="{{ url_for('web.cerrar', motivo='inactividad') }}"></script>
</body>

</html>
