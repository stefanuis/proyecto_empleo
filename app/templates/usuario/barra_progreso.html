<div class="barra-progreso-container">

  <div class="barra-progreso-header">
    <span class="paso-nombre">{{ nombre_paso }}</span>
    <span class="paso-contador">Paso {{ paso_actual }} de {{ total_pasos }}</span>
  </div>

  <div class="barra-progreso-wrapper">
    <div class="barra-progreso"
         role="progressbar"
         aria-valuenow="{{ paso_actual }}"
         aria-valuemin="1"
         aria-valuemax="{{ total_pasos }}"
         style="width: {{ (paso_actual / total_pasos * 100)|int }}%">
    </div>
  </div>


  <div class="pasos-indicador">
    {% for i in range(1, total_pasos + 1) %}
      <div class="paso-punto {% if i < paso_actual %}completado{% elif i == paso_actual %}activo{% endif %}">
      </div>
    {% endfor %}
  </div>

</div>

<style>
 
  .barra-progreso-container {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }

  .barra-progreso-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .paso-nombre {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: -0.3px;
  }

  .paso-contador {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .barra-progreso-wrapper {
    width: 100%;
    height: 6px;
    background: #E8E8E8;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .barra-progreso {
    height: 100%;
    background: var(--primary);
    border-radius: 10px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 4px rgba(216, 27, 96, 0.3);
  }

  .pasos-indicador {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
  }

  .paso-punto {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #E8E8E8;
    border: 2px solid #E8E8E8;
    transition: all 0.3s ease;
  }

  .paso-punto.completado {
    background: var(--primary);
    border-color: var(--primary);
  }

  .paso-punto.activo {
    background: var(--bg-main);
    border-color: var(--primary);
    width: 14px;
    height: 14px;
    box-shadow: 0 0 0 4px var(--primary-ultra-light);
  }

  /* ─────────────────────────────────────────
     RESPONSIVE
     ───────────────────────────────────────── */

  @media (max-width: 768px) {
    .barra-progreso-container {
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    .paso-nombre {
      font-size: 14px;
    }

    .paso-contador {
      font-size: 11px;
    }

    .barra-progreso-wrapper {
      height: 5px;
    }
  }

  @media (max-width: 480px) {
    .barra-progreso-container {
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .barra-progreso-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .paso-nombre {
      font-size: 13px;
    }

    .paso-contador {
      font-size: 10px;
    }

    .barra-progreso-wrapper {
      height: 4px;
    }

    .paso-punto {
      width: 8px;
      height: 8px;
    }

    .paso-punto.activo {
      width: 11px;
      height: 11px;
    }
  }
</style>
