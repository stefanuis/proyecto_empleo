<div class="barra-progreso-container">

  <div class="barra-progreso-header">
    <span class="paso-nombre">{{ nombre_paso }}</span>
    <p class="paso-descripcion">{{ descripcion_paso }}</p>
    <span class="paso-contador">Paso {{ paso_actual }} de {{ total_pasos }}</span>
  </div>

  <div class="barra-progreso-wrapper">
    <div class="barra-progreso"
         role="progressbar"
         aria-valuenow="{{ paso_actual }}"
         aria-valuemin="1"
         aria-valuemax="{{ total_pasos }}"
         style="width: {{ (paso_actual / total_pasos * 100)|int }}%">
    </div>
  </div>

  <div class="pasos-indicador">
    {% for i in range(1, total_pasos + 1) %}
      <a {% if i <= paso_habilitado_hasta %}href="{{ url_for('usuario.' + pasos_rutas[i - 1]) }}"{% else %}aria-disabled="true"{% endif %}
              {% if i == paso_actual %}aria-current="step"{% endif %}
              title="{{ nombres_cortos_pasos[pasos_rutas[i - 1]] }}"
              class="paso-punto {% if i < paso_actual %}completado{% elif i == paso_actual %}activo{% endif %}"
              {% if i > paso_habilitado_hasta %}tabindex="-1"{% endif %}>
      </a>
    {% endfor %}
  </div>

</div>
